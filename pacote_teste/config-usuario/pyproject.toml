[tool.poetry]
name = "config-usuario"
version = "0.0.1"
description = "Pacote de configuracao do usuario do sagemaker studio "
authors = ["vagnerasilva <vagnerasilva>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
isort = "^5.13.2"
pytest-cov = "^5.0.0"
blue = "^0.9.1"
taskipy = "^1.13.0"


[tool.poetry.group.doc.dependencies]
mkdocs = "^1.6.0"
material = "^0.1"
mkdocs-material = "^9.5.31"
mkdocstrings = "^0.19.1"
mkdocstrings-python = "^0.8.3"
mkdocs-macros-plugin = "^0.7.0"
jinja2 = "^3.1.2"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.pytest.ini_options]
pythonpath = "."
addopts = "--doctest-modules"


[tool.taskipy.tasks]
docs = "mkdocs serve"
test = "pytest -s -x --cov=notas_musicais -vv"
post_test = "coverage html"